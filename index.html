  const r = c.radius, hx = r / 2;
  $id('gcLegNeedle').setAttribute('d', `M ${hx},-180 L 0,0`);
  $id('gcLegPencil').setAttribute('d', `M ${hx},-180 L ${r},0`);
  $id('gcPivotOuter').setAttribute('cx', hx);
  $id('gcPivotInner').setAttribute('cx', hx);
  $id('gcHead').setAttribute('transform', `translate(${hx - 60}, 0)`);
  $id('gcScrew').setAttribute('transform', `translate(${hx - 60}, 0)`);
  $id('gcPencil').setAttribute('transform', `translate(${r}, 0)`);
  $id('gcRadiusHandleCircle').setAttribute('cx', r);
  $id('gcGuide').setAttribute('r', r);
  $id('gcRadiusLine').setAttribute('x2', r);
  $id('gcBadge').setAttribute('transform', `translate(${r / 2}, -20)`);
  $id('gcRadiusText').textContent = (r / 32).toFixed(1) + ' cm';
}

// ---------- ölçülü kenarlar (cetvel üst kenarı, gönyenin iki dik kenarı) ----------
function instPoint(inst, lx, ly) {
  const a = inst.angle * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  const dx = lx - inst.width / 2, dy = ly - inst.height / 2;
  return { x: inst.x + inst.width / 2 + dx * c - dy * s, y: inst.y + inst.height / 2 + dx * s + dy * c };
}
function instVec(inst, vx, vy) {
  const a = inst.angle * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return { x: vx * c - vy * s, y: vx * s + vy * c };
}
function makeEdge(key, a, b, n) {
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
  return { key, a, len, u: { x: dx / len, y: dy / len }, n };
}
function getEdges() {
  const list = [];
  if (G.ruler.visible) {
    const r = G.ruler;
    list.push(makeEdge('ruler', instPoint(r, 0, 0), instPoint(r, r.width, 0), instVec(r, 0, -1)));
  }
  if (G.triangle45.visible) {
    const t = G.triangle45, s = t.width, p = TRI_PAD;
    const B = instPoint(t, p, s - p);
    list.push(makeEdge('triangle45', B, instPoint(t, p, p), instVec(t, -1, 0)));
    list.push(makeEdge('triangle45', B, instPoint(t, s - p, s - p), instVec(t, 0, 1)));
  }
  return list;
}
function findEdge(pos, outside, inside, onlyKey) {
  let best = null;
  getEdges().forEach(ed => {
    if (onlyKey && ed.key !== onlyKey) return;
    const vx = pos.x - ed.a.x, vy = pos.y - ed.a.y;
    const t = vx * ed.u.x + vy * ed.u.y;
    if (t < -12 || t > ed.len + 12) return;
    const d = vx * ed.n.x + vy * ed.n.y;
    if (d > outside || d < -inside) return;
    if (!best || Math.abs(d) < Math.abs(best.d)) best = { edge: ed, t: gclamp(t, 0, ed.len), d };
  });
  return best;
}
function edgeT(pos, ed) {
  return gclamp((pos.x - ed.a.x) * ed.u.x + (pos.y - ed.a.y) * ed.u.y, 0, ed.len);
}
function edgeLinePoints(ed, t0, t1, size) {
  const off = size / 2 + 1;   // çizgi kenara tam yaslanır
  return {
    x1: ed.a.x + ed.u.x * t0 + ed.n.x * off, y1: ed.a.y + ed.u.y * t0 + ed.n.y * off,
    x2: ed.a.x + ed.u.x * t1 + ed.n.x * off, y2: ed.a.y + ed.u.y * t1 + ed.n.y * off,
  };
}
function previewEdgeLine(ed, t0, t1) {
  const L = edgeLinePoints(ed, t0, t1, state.brushSize);
  toolCtx.clearRect(0, 0, toolCanvas.width, toolCanvas.height);
  toolCtx.save();
  toolCtx.lineCap = 'round';
  toolCtx.strokeStyle = state.color;
  toolCtx.lineWidth = state.brushSize;
  toolCtx.beginPath(); toolCtx.moveTo(L.x1, L.y1); toolCtx.lineTo(L.x2, L.y2); toolCtx.stroke();
  toolCtx.restore();
}
const canEdgeDraw = () => state.tool === 'pen';

// ---------- cetvel & gönye etkileşimi ----------
const instSessions = {};
function setupInstrument(key) {
  const el = $id(INST_EL[key]);
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const actEl = e.target.closest('[data-action]');
    const action = actEl ? actEl.getAttribute('data-action') : null;
    // Kalemle ölçülü kenarın üstünden başlanırsa: aleti taşıma, düz çiz
    if (!action && canEdgeDraw() && state.pdf) {
      const hit = findEdge(getPointer(e), 4, EDGE_INSIDE, key);
      if (hit) { e.stopPropagation(); startDraw(e, hit); return; }
    }
    if (instSessions[key]) { if (!e.isPrimary) return; instSessions[key].end(); }
    e.preventDefault(); e.stopPropagation();
    const inst = G[key];
    const b = el.getBoundingClientRect();
    const cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    const sx = e.clientX, sy = e.clientY;
    const st = { x: inst.x, y: inst.y, w: inst.width, h: inst.height };
    const mode = action || 'drag';
    let prevPtr = Math.atan2(e.clientY - cy, e.clientX - cx);
    instSessions[key] = dragSession(e, ev => {
      if (mode === 'drag') {
        inst.x = st.x + (ev.clientX - sx);
        inst.y = st.y + (ev.clientY - sy);
      } else if (mode === 'rotate') {
        const cur = Math.atan2(ev.clientY - cy, ev.clientX - cx);
        inst.angle += angleDiff(cur, prevPtr) * 180 / Math.PI;
        prevPtr = cur;
      } else {
        const a = inst.angle * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a);
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        const lx = dx * cs + dy * sn, ly = -dx * sn + dy * cs;
        let nw, nh;
        if (key === 'ruler') { nw = gclamp(st.w + lx, 200, 1400); nh = st.h; }
        else { nw = nh = gclamp(st.w + (lx + ly) / 2, 160, 900); }
        const c0x = st.x + st.w / 2, c0y = st.y + st.h / 2;
        const hw = (nw - st.w) / 2, hh = (nh - st.h) / 2;
        const c1x = c0x + hw * cs - hh * sn, c1y = c0y + hw * sn + hh * cs;
        inst.x = c1x - nw / 2; inst.y = c1y - nh / 2;
        inst.width = nw; inst.height = nh;
        rafOnce(key, key === 'ruler' ? renderRulerGraphics : renderTriangleGraphics);
      }
      applyInstrumentTransform(key);
    }, () => { instSessions[key] = null; });
  });
}
setupInstrument('ruler');
setupInstrument('triangle45');

// ---------- açıölçer: gövdeden taşı, yeşil noktadan büyüt/küçült + döndür ----------
(() => {
  const el = $id('gProt');
  let session = null;
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    if (e.target.closest('#gToggle360')) return;
    if (session) { if (!e.isPrimary) return; session.end(); }
    e.preventDefault(); e.stopPropagation();
    const p = G.protractor;
    const mode = e.target.closest('[data-action]') ? 'resize' : 'drag';
    const piv = stageToClient(p.x, p.y);
    let prevPtr = Math.atan2(e.clientY - piv.y, e.clientX - piv.x);
    const startDist = Math.hypot(e.clientX - piv.x, e.clientY - piv.y);
    const sx = e.clientX, sy = e.clientY, st = { x: p.x, y: p.y, r: p.radius };
    session = dragSession(e, ev => {
      if (mode === 'drag') {
        p.x = st.x + (ev.clientX - sx);
        p.y = st.y + (ev.clientY - sy);
      } else {
        const dist = Math.hypot(ev.clientX - piv.x, ev.clientY - piv.y);
        p.radius = gclamp(st.r + (dist - startDist), 90, 560);
        const cur = Math.atan2(ev.clientY - piv.y, ev.clientX - piv.x);
        p.angle += angleDiff(cur, prevPtr) * 180 / Math.PI;
        prevPtr = cur;
        rafOnce('protractor', renderProtractorGraphics);
      }
      updateProtractorTransform();
    }, () => { session = null; });
  });
  $id('gToggle360').addEventListener('click', e => {
    e.stopPropagation();
    G.protractor.mode360 = !G.protractor.mode360;
    renderProtractorGraphics();
    updateProtractorTransform();
  });
})();

// ---------- pergel: bacaklar taşı · baş döndürür ve çizer · kalem ucu yarıçap ----------
(() => {
  const el = $id('gCompass');
  let session = null;
  const guides = on => ['gcGuide', 'gcRadiusLine', 'gcBadge'].forEach(id => $id(id).setAttribute('opacity', on ? '1' : '0'));
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const roleEl = e.target.closest('[data-role]');
    if (!roleEl) return;
    if (session) { if (!e.isPrimary) return; session.end(); }
    e.preventDefault(); e.stopPropagation();
    const c = G.compass;
    const mode = roleEl.getAttribute('data-role');
    const sx = e.clientX, sy = e.clientY, st = { x: c.x, y: c.y, r: c.radius };
    const needle = stageToClient(c.x, c.y);
    let prevPtr = Math.atan2(e.clientY - needle.y, e.clientX - needle.x);
    const startDist = Math.hypot(e.clientX - needle.x, e.clientY - needle.y);
    const arcStart = c.angle * Math.PI / 180;
    let travel = 0;
    if (mode === 'rotate') $id('gcActiveRing').setAttribute('opacity', '1');
    if (mode === 'radius') guides(true);

    session = dragSession(e, ev => {
      if (mode === 'move') {
        c.x = st.x + (ev.clientX - sx);
        c.y = st.y + (ev.clientY - sy);
      } else {
        const cur = Math.atan2(ev.clientY - needle.y, ev.clientX - needle.x);
        const dA = angleDiff(cur, prevPtr);
        prevPtr = cur;
        c.angle += dA * 180 / Math.PI;
        if (mode === 'radius') {
          const d = Math.hypot(ev.clientX - needle.x, ev.clientY - needle.y);
          c.radius = gclamp(st.r + (d - startDist), 30, 700);
        } else if (state.pdf) {
          travel += dA;
          // canlı önizleme (bırakınca kalıcı yay / çember olur)
          toolCtx.clearRect(0, 0, toolCanvas.width, toolCanvas.height);
          toolCtx.save();
          toolCtx.lineCap = 'round';
          toolCtx.strokeStyle = state.color;
          toolCtx.lineWidth = state.brushSize;
          toolCtx.beginPath();
          toolCtx.arc(c.x, c.y, c.radius, arcStart, arcStart + travel, travel < 0);
          toolCtx.stroke();
          toolCtx.restore();
        }
      }
      rafOnce('compass', updateCompassTransform);
    }, () => {
      session = null;
      guides(false);
      $id('gcActiveRing').setAttribute('opacity', '0');
      toolCtx.clearRect(0, 0, toolCanvas.width, toolCanvas.height);
      if (mode === 'rotate' && state.pdf && Math.abs(travel) > 0.02) {
        if (Math.abs(travel) >= Math.PI * 2 - 0.05) {
          pushPath({ type: 'circle', color: state.color, size: state.brushSize, cx: c.x, cy: c.y, r: c.radius });
          toast('Çember çizildi · r = ' + (c.radius / 32).toFixed(1) + ' cm');
        } else {
          pushPath({ type: 'arc', color: state.color, size: state.brushSize, cx: c.x, cy: c.y, r: c.radius,
                     a0: arcStart, a1: arcStart + travel, ccw: travel < 0 });
        }
      }
      updateCompassTransform();
    });
  });
})();

// ---------- göster / gizle ----------
function visibleCenter() {
  const w = workspace.getBoundingClientRect(), s = canvasStage.getBoundingClientRect();
  return { x: w.left + w.width / 2 - s.left, y: w.top + w.height / 2 - s.top, vw: w.width, vh: w.height };
}
function syncInstButtons() {
  Object.keys(MENU_KEY).forEach(t => {
    $$(`.tool-btn[data-tool="${t}"]`).forEach(b => b.classList.toggle('active', !!G[MENU_KEY[t]].visible));
  });
}
function toggleInstrument(menuTool) {
  if (!state.pdf) { toast('Önce PDF yükleyin'); return; }
  const key = MENU_KEY[menuTool];
  const inst = G[key];
  inst.visible = !inst.visible;
  $id(INST_EL[key]).classList.toggle('g-hidden', !inst.visible);
  if (inst.visible) {
    const v = visibleCenter();
    if (v.vw < 600) {                                  // telefon
      if (G.protractor.radius > 140) { G.protractor.radius = 130; renderProtractorGraphics(); }
      if (G.triangle45.width > 230) { G.triangle45.width = G.triangle45.height = 220; renderTriangleGraphics(); }
      if (G.compass.radius > 120) G.compass.radius = 110;
    }
    if (key === 'ruler' || key === 'triangle45') {
      if (key === 'ruler') { inst.width = Math.max(200, Math.min(480, Math.round(v.vw * 0.8))); renderRulerGraphics(); }
      inst.x = v.x - inst.width / 2; inst.y = v.y - inst.height / 2;
      applyInstrumentTransform(key);
    } else if (key === 'protractor') {
      inst.x = v.x; inst.y = v.y + G.protractor.radius / 3;
      updateProtractorTransform();
    } else {
      inst.x = v.x; inst.y = v.y + Math.min(120, v.vh * 0.15);
      updateCompassTransform();
    }
    const tips = {
      ruler: 'Cetvel: gövdeden taşı · mavi döndür · yeşil uzat · kalemle çentikli kenardan düz çizgi',
      protractor: 'Açıölçer: gövdeden taşı · yeşil nokta büyüt/küçült ve döndür',
      triangle45: 'Gönye: gövdeden taşı · mavi döndür · yeşil büyüt · kalemle iki dik kenardan düz çizgi',
      compass: 'Pergel: bacaklardan taşı · kalem ucundan aç/kapa · baştan tutup çevir → çizer',
    };
    toast(tips[key], 3400);
  }
  syncInstButtons();
}
function hideAllInstruments() {
  Object.keys(G).forEach(k => { G[k].visible = false; $id(INST_EL[k]).classList.add('g-hidden'); });
  syncInstButtons();
}

renderRulerGraphics();
renderProtractorGraphics();
renderTriangleGraphics();
applyInstrumentTransform('ruler');
applyInstrumentTransform('triangle45');
updateProtractorTransform();
updateCompassTransform();

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.key.toLowerCase() === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (e.key === 'ArrowLeft') changePage(-1);
  if (e.key === 'ArrowRight') changePage(1);
  if (e.key === '+' || e.key === '=') setScale(state.scale + 0.1);
  if (e.key === '-') setScale(state.scale - 0.1);
  if (e.key === 'f' || e.key === 'F') toggleFullscreen();
  if (e.key === 'Escape') { menu.classList.remove('open'); clearCompass(); }
});

updateUndoButtons();
updateCursor();
toast('Z-Kitap hazır · PDF yükleyin', 2800);
</script>
</body>
