<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <title>Z-Kitap · Akıllı Tahta</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111827;
      --panel-2: #1e293b;
      --accent: #38bdf8;
      --accent-2: #818cf8;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --danger: #f87171;
      --success: #34d399;
      --border: rgba(148,163,184,0.25);
      --shadow: 0 10px 40px rgba(0,0,0,0.45);
      --radius: 16px;
      --touch: 48px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100%;
      width: 100%;
    }

    /* ========== TOP BAR ========== */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      position: relative;
    }
    .logo {
      font-weight: 800;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      white-space: nowrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-width: var(--touch);
      min-height: var(--touch);
      padding: 0 14px;
      border: none;
      border-radius: 12px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, box-shadow 0.15s;
      touch-action: manipulation;
    }
    .btn:hover, .btn:focus-visible { background: #334155; }
    .btn:active { transform: scale(0.96); }
    .btn.primary {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 4px 16px rgba(56,189,248,0.35);
    }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.danger { background: #7f1d1d; color: #fecaca; }
    .btn.icon-only { width: var(--touch); padding: 0; font-size: 1.35rem; }
    .btn.active {
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      box-shadow: 0 0 0 2px rgba(56,189,248,0.5);
    }
    .spacer { flex: 1; }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ========== + MENU ========== */
    .menu-wrap { position: relative; }
    .menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: min(340px, 92vw);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 12px;
      display: none;
      flex-direction: column;
      gap: 8px;
      z-index: 100;
      max-height: 78vh;
      overflow-y: auto;
    }
    .menu.open { display: flex; animation: slideIn 0.2s ease; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .menu-section {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin: 6px 4px 2px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .tool-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 64px;
      padding: 8px 4px;
      border-radius: 12px;
      background: var(--panel-2);
      border: 1px solid transparent;
      color: var(--text);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-btn span.icon { font-size: 1.4rem; line-height: 1; }
    .tool-btn:hover, .tool-btn:focus-visible { background: #334155; }
    .tool-btn.active {
      background: linear-gradient(135deg, rgba(14,165,233,0.25), rgba(99,102,241,0.25));
      border-color: var(--accent);
      color: var(--accent);
    }
    .color-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px;
    }
    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active { border-color: #fff; box-shadow: 0 0 0 2px var(--accent); }
    .slider-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 6px;
    }
    .slider-row label { font-size: 0.8rem; color: var(--muted); min-width: 70px; }
    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 6px;
    }
    .menu-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }
    .menu-actions .btn { width: 100%; font-size: 0.85rem; min-height: 44px; }

    /* ========== WORKSPACE ========== */
    .workspace {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(56,189,248,0.07), transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(129,140,248,0.06), transparent 50%),
        #0b1220;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .canvas-wrap {
      position: relative;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
      border-radius: 4px;
      overflow: hidden;
      background: #1a1a1a;
      max-width: 100%;
      max-height: 100%;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #pdfCanvas { position: absolute; top: 0; left: 0; }
    #drawCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; }
    #toolCanvas { position: absolute; top: 0; left: 0; pointer-events: none; }

    .empty-state {
      text-align: center;
      padding: 40px 24px;
      color: var(--muted);
      max-width: 420px;
    }
    .empty-state h2 {
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .empty-state p { line-height: 1.55; margin-bottom: 20px; }
    .empty-state .btn { margin: 0 auto; }

    /* Geometry overlays (DOM based for ease) */
    .geo-overlay {
      position: absolute;
      pointer-events: auto;
      z-index: 20;
      touch-action: none;
    }
    .ruler {
      height: 48px;
      background: linear-gradient(180deg, #fef3c7, #fde68a);
      border: 2px solid #d97706;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      cursor: move;
    }
    .ruler .marks {
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(90deg,
          transparent 0, transparent 9px,
          #92400e 9px, #92400e 10px);
      opacity: 0.55;
    }
    .ruler .label {
      position: absolute;
      top: 4px;
      left: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #78350f;
    }
    .protractor {
      width: 220px;
      height: 110px;
      background: rgba(255,255,255,0.92);
      border: 2px solid #0ea5e9;
      border-radius: 110px 110px 0 0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
      cursor: move;
      position: relative;
    }
    .protractor::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: #ef4444;
      transform: translateX(-50%);
    }
    .set-square {
      width: 0;
      height: 0;
      border-left: 140px solid transparent;
      border-right: 140px solid transparent;
      border-bottom: 140px solid rgba(52,211,153,0.85);
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
      cursor: move;
      position: relative;
    }
    .compass-hint {
      position: absolute;
      border: 2px dashed var(--accent);
      border-radius: 50%;
      pointer-events: none;
    }

    /* ========== BOTTOM BAR ========== */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 10px 16px;
      background: linear-gradient(0deg, #0f172a 0%, #111827 100%);
      border-top: 1px solid var(--border);
      z-index: 40;
      flex-wrap: wrap;
    }
    .page-info {
      font-size: 0.95rem;
      font-weight: 600;
      min-width: 90px;
      text-align: center;
      color: var(--muted);
    }
    .page-info strong { color: var(--text); }
    .page-input {
      width: 64px;
      height: 40px;
      text-align: center;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      font-size: 1rem;
      font-weight: 600;
    }
    .zoom-label {
      font-size: 0.85rem;
      color: var(--muted);
      min-width: 52px;
      text-align: center;
    }

    /* Fullscreen tweaks */
    :fullscreen .topbar,
    :fullscreen .bottombar { background: rgba(15,23,42,0.95); }

    /* File input hidden */
    #fileInput { display: none; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: all 0.3s;
      z-index: 200;
      pointer-events: none;
      font-weight: 600;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- TOP -->
    <header class="topbar">
      <div class="menu-wrap">
        <button class="btn icon-only primary" id="menuBtn" title="Araçlar">＋</button>
        <div class="menu" id="toolsMenu">
          <div class="menu-section">Çizim</div>
          <div class="menu-grid">
            <button class="tool-btn active" data-tool="pen"><span class="icon">✏️</span>Kalem</button>
            <button class="tool-btn" data-tool="eraser"><span class="icon">🧽</span>Silgi</button>
            <button class="tool-btn" data-tool="line"><span class="icon">／</span>Çizgi</button>
            <button class="tool-btn" data-tool="rect"><span class="icon">▭</span>Dikdörtgen</button>
          </div>

          <div class="menu-section">Renk</div>
          <div class="color-row" id="colorRow">
            <div class="swatch active" data-color="#ef4444" style="background:#ef4444"></div>
            <div class="swatch" data-color="#f97316" style="background:#f97316"></div>
            <div class="swatch" data-color="#eab308" style="background:#eab308"></div>
            <div class="swatch" data-color="#22c55e" style="background:#22c55e"></div>
            <div class="swatch" data-color="#0ea5e9" style="background:#0ea5e9"></div>
            <div class="swatch" data-color="#8b5cf6" style="background:#8b5cf6"></div>
            <div class="swatch" data-color="#ec4899" style="background:#ec4899"></div>
            <div class="swatch" data-color="#ffffff" style="background:#ffffff"></div>
            <div class="swatch" data-color="#1e293b" style="background:#1e293b"></div>
          </div>

          <div class="menu-section">Kalınlık</div>
          <div class="slider-row">
            <label>İnce ↔ Kalın</label>
            <input type="range" id="brushSize" min="1" max="40" value="4" />
            <span id="brushVal">4</span>
          </div>

          <div class="menu-section">Geometri Seti</div>
          <div class="menu-grid">
            <button class="tool-btn" data-tool="ruler"><span class="icon">📏</span>Cetvel</button>
            <button class="tool-btn" data-tool="protractor"><span class="icon">📐</span>Açıölçer</button>
            <button class="tool-btn" data-tool="setsquare"><span class="icon">△</span>Gönye</button>
            <button class="tool-btn" data-tool="compass"><span class="icon">⭕</span>Pergel</button>
          </div>

          <div class="menu-section">Görünüm</div>
          <div class="menu-grid">
            <button class="tool-btn" id="zoomInBtn"><span class="icon">🔍+</span>Büyüt</button>
            <button class="tool-btn" id="zoomOutBtn"><span class="icon">🔍−</span>Küçült</button>
            <button class="tool-btn" id="fitWidthBtn"><span class="icon">↔</span>Genişlik</button>
            <button class="tool-btn" id="fullscreenBtn"><span class="icon">⛶</span>Tam Ekran</button>
          </div>

          <div class="menu-section">Dosya & Temizlik</div>
          <div class="menu-actions">
            <button class="btn primary" id="loadPdfBtn">📄 PDF Yükle</button>
            <button class="btn" id="clearPageBtn">🧹 Sayfayı Temizle</button>
            <button class="btn danger" id="removePdfBtn">🗑 PDF Kaldır</button>
            <button class="btn" id="clearAllBtn">✨ Tümünü Temizle</button>
          </div>
        </div>
      </div>

      <div class="logo">Z-Kitap</div>
      <div class="spacer"></div>
      <div class="status" id="fileStatus">PDF yüklenmedi</div>
      <button class="btn icon-only" id="quickLoad" title="PDF Yükle">📂</button>
    </header>

    <!-- WORKSPACE -->
    <main class="workspace" id="workspace">
      <div class="empty-state" id="emptyState">
        <h2>Z-Kitap Hazır</h2>
        <p>PDF dosyanızı yükleyin. Kalem, silgi, cetvel, pergel, gönye ve açıölçer ile akıllı tahtada işaretleme yapabilirsiniz. Pardus ve Linux tarayıcılarında sorunsuz çalışır.</p>
        <button class="btn primary" id="emptyLoadBtn">PDF Yükle</button>
      </div>
      <div class="canvas-wrap" id="canvasWrap" style="display:none;">
        <canvas id="pdfCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
        <canvas id="toolCanvas"></canvas>
      </div>
    </main>

    <!-- BOTTOM -->
    <footer class="bottombar">
      <button class="btn icon-only" id="prevPage" title="Önceki">◀</button>
      <input type="number" class="page-input" id="pageInput" min="1" value="1" />
      <span class="page-info">/ <strong id="pageCount">0</strong></span>
      <button class="btn icon-only" id="nextPage" title="Sonraki">▶</button>
      <div class="spacer" style="max-width:40px;"></div>
      <button class="btn icon-only" id="zoomOutBottom" title="Küçült">−</button>
      <span class="zoom-label" id="zoomLabel">100%</span>
      <button class="btn icon-only" id="zoomInBottom" title="Büyüt">+</button>
    </footer>
  </div>

  <input type="file" id="fileInput" accept="application/pdf,.pdf" />
  <div class="toast" id="toast"></div>

  <script type="module">
    import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';

    // ---------- State ----------
    const state = {
      pdf: null,
      pageNum: 1,
      pageCount: 0,
      scale: 1.2,
      tool: 'pen',
      color: '#ef4444',
      brushSize: 4,
      drawing: false,
      lastX: 0,
      lastY: 0,
      annotations: {}, // pageNum -> ImageData or paths
      paths: {},       // pageNum -> array of path objects
      startX: 0,
      startY: 0,
      tempShape: null,
      geoElements: [],
      compassCenter: null,
    };

    // ---------- DOM ----------
    const $ = (s) => document.querySelector(s);
    const $$ = (s) => document.querySelectorAll(s);
    const pdfCanvas = $('#pdfCanvas');
    const drawCanvas = $('#drawCanvas');
    const toolCanvas = $('#toolCanvas');
    const pdfCtx = pdfCanvas.getContext('2d');
    const drawCtx = drawCanvas.getContext('2d');
    const toolCtx = toolCanvas.getContext('2d');
    const canvasWrap = $('#canvasWrap');
    const workspace = $('#workspace');
    const emptyState = $('#emptyState');
    const menu = $('#toolsMenu');
    const menuBtn = $('#menuBtn');
    const fileInput = $('#fileInput');
    const toastEl = $('#toast');

    // ---------- Utils ----------
    function toast(msg, ms = 2200) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), ms);
    }

    function getPointer(e) {
      const rect = drawCanvas.getBoundingClientRect();
      let clientX, clientY;
      if (e.touches && e.touches.length) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else if (e.changedTouches && e.changedTouches.length) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }
      return {
        x: (clientX - rect.left) * (drawCanvas.width / rect.width),
        y: (clientY - rect.top) * (drawCanvas.height / rect.height)
      };
    }

    // ---------- Menu ----------
    menuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('open');
    });
    document.addEventListener('click', (e) => {
      if (!menu.contains(e.target) && e.target !== menuBtn) menu.classList.remove('open');
    });

    // Tool buttons
    $$('.tool-btn[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.tool = btn.dataset.tool;
        clearGeoHints();
        if (['ruler','protractor','setsquare'].includes(state.tool)) {
          spawnGeometry(state.tool);
        }
        menu.classList.remove('open');
        toast(btn.textContent.trim() + ' seçildi');
      });
    });

    // Colors
    $$('.swatch').forEach(s => {
      s.addEventListener('click', () => {
        $$('.swatch').forEach(x => x.classList.remove('active'));
        s.classList.add('active');
        state.color = s.dataset.color;
      });
    });

    // Brush
    const brushSize = $('#brushSize');
    brushSize.addEventListener('input', () => {
      state.brushSize = +brushSize.value;
      $('#brushVal').textContent = state.brushSize;
    });

    // File load
    function triggerLoad() { fileInput.click(); }
    $('#loadPdfBtn').addEventListener('click', triggerLoad);
    $('#quickLoad').addEventListener('click', triggerLoad);
    $('#emptyLoadBtn').addEventListener('click', triggerLoad);

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const buf = await file.arrayBuffer();
        state.pdf = await pdfjsLib.getDocument({ data: buf }).promise;
        state.pageCount = state.pdf.numPages;
        state.pageNum = 1;
        state.paths = {};
        state.annotations = {};
        $('#pageCount').textContent = state.pageCount;
        $('#fileStatus').textContent = file.name;
        emptyState.style.display = 'none';
        canvasWrap.style.display = 'block';
        await renderPage();
        toast('PDF yüklendi · ' + state.pageCount + ' sayfa');
        menu.classList.remove('open');
      } catch (err) {
        console.error(err);
        toast('PDF açılamadı');
      }
      fileInput.value = '';
    });

    // Clear / Remove
    $('#clearPageBtn').addEventListener('click', () => {
      if (!state.pdf) return;
      state.paths[state.pageNum] = [];
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      toast('Sayfa temizlendi');
      menu.classList.remove('open');
    });
    $('#clearAllBtn').addEventListener('click', () => {
      state.paths = {};
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      toast('Tüm işaretler silindi');
      menu.classList.remove('open');
    });
    $('#removePdfBtn').addEventListener('click', () => {
      state.pdf = null;
      state.paths = {};
      state.pageCount = 0;
      state.pageNum = 1;
      pdfCtx.clearRect(0, 0, pdfCanvas.width, pdfCanvas.height);
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      canvasWrap.style.display = 'none';
      emptyState.style.display = 'block';
      $('#pageCount').textContent = '0';
      $('#fileStatus').textContent = 'PDF yüklenmedi';
      clearAllGeo();
      toast('PDF kaldırıldı');
      menu.classList.remove('open');
    });

    // Zoom
    function setScale(s) {
      state.scale = Math.max(0.4, Math.min(3.5, s));
      $('#zoomLabel').textContent = Math.round(state.scale * 100) + '%';
      if (state.pdf) renderPage();
    }
    $('#zoomInBtn').addEventListener('click', () => { setScale(state.scale + 0.15); menu.classList.remove('open'); });
    $('#zoomOutBtn').addEventListener('click', () => { setScale(state.scale - 0.15); menu.classList.remove('open'); });
    $('#zoomInBottom').addEventListener('click', () => setScale(state.scale + 0.15));
    $('#zoomOutBottom').addEventListener('click', () => setScale(state.scale - 0.15));
    $('#fitWidthBtn').addEventListener('click', async () => {
      if (!state.pdf) return;
      const page = await state.pdf.getPage(state.pageNum);
      const vp = page.getViewport({ scale: 1 });
      const avail = workspace.clientWidth - 40;
      setScale(avail / vp.width);
      menu.classList.remove('open');
    });

    // Fullscreen
    $('#fullscreenBtn').addEventListener('click', () => {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
      menu.classList.remove('open');
    });

    // Page nav
    $('#prevPage').addEventListener('click', () => changePage(-1));
    $('#nextPage').addEventListener('click', () => changePage(1));
    $('#pageInput').addEventListener('change', () => {
      let n = parseInt($('#pageInput').value, 10);
      if (isNaN(n) || n < 1) n = 1;
      if (n > state.pageCount) n = state.pageCount;
      state.pageNum = n;
      renderPage();
    });

    async function changePage(delta) {
      if (!state.pdf) return;
      const next = state.pageNum + delta;
      if (next < 1 || next > state.pageCount) return;
      state.pageNum = next;
      await renderPage();
    }

    // ---------- Render PDF ----------
    async function renderPage() {
      if (!state.pdf) return;
      const page = await state.pdf.getPage(state.pageNum);
      const viewport = page.getViewport({ scale: state.scale });
      const w = Math.floor(viewport.width);
      const h = Math.floor(viewport.height);

      [pdfCanvas, drawCanvas, toolCanvas].forEach(c => {
        c.width = w;
        c.height = h;
        c.style.width = w + 'px';
        c.style.height = h + 'px';
      });
      canvasWrap.style.width = w + 'px';
      canvasWrap.style.height = h + 'px';

      pdfCtx.clearRect(0, 0, w, h);
      await page.render({ canvasContext: pdfCtx, viewport }).promise;

      // Restore annotations
      drawCtx.clearRect(0, 0, w, h);
      const paths = state.paths[state.pageNum] || [];
      paths.forEach(p => drawPath(p));

      $('#pageInput').value = state.pageNum;
      $('#zoomLabel').textContent = Math.round(state.scale * 100) + '%';
    }

    function drawPath(p) {
      drawCtx.save();
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      if (p.type === 'pen') {
        drawCtx.strokeStyle = p.color;
        drawCtx.lineWidth = p.size;
        drawCtx.globalCompositeOperation = 'source-over';
        drawCtx.beginPath();
        p.points.forEach((pt, i) => {
          if (i === 0) drawCtx.moveTo(pt.x, pt.y);
          else drawCtx.lineTo(pt.x, pt.y);
        });
        drawCtx.stroke();
      } else if (p.type === 'eraser') {
        drawCtx.globalCompositeOperation = 'destination-out';
        drawCtx.lineWidth = p.size;
        drawCtx.beginPath();
        p.points.forEach((pt, i) => {
          if (i === 0) drawCtx.moveTo(pt.x, pt.y);
          else drawCtx.lineTo(pt.x, pt.y);
        });
        drawCtx.stroke();
      } else if (p.type === 'line') {
        drawCtx.strokeStyle = p.color;
        drawCtx.lineWidth = p.size;
        drawCtx.beginPath();
        drawCtx.moveTo(p.x1, p.y1);
        drawCtx.lineTo(p.x2, p.y2);
        drawCtx.stroke();
      } else if (p.type === 'rect') {
        drawCtx.strokeStyle = p.color;
        drawCtx.lineWidth = p.size;
        drawCtx.strokeRect(p.x, p.y, p.w, p.h);
      } else if (p.type === 'circle') {
        drawCtx.strokeStyle = p.color;
        drawCtx.lineWidth = p.size;
        drawCtx.beginPath();
        drawCtx.arc(p.cx, p.cy, p.r, 0, Math.PI * 2);
        drawCtx.stroke();
      }
      drawCtx.restore();
    }

    // ---------- Drawing ----------
    function startDraw(e) {
      if (!state.pdf) return;
      e.preventDefault();
      const { x, y } = getPointer(e);
      state.drawing = true;
      state.lastX = x;
      state.lastY = y;
      state.startX = x;
      state.startY = y;

      if (state.tool === 'pen' || state.tool === 'eraser') {
        if (!state.paths[state.pageNum]) state.paths[state.pageNum] = [];
        state.tempShape = {
          type: state.tool,
          color: state.color,
          size: state.brushSize * (state.tool === 'eraser' ? 2.5 : 1),
          points: [{ x, y }]
        };
      } else if (state.tool === 'compass') {
        state.compassCenter = { x, y };
      } else if (state.tool === 'line' || state.tool === 'rect') {
        state.tempShape = { type: state.tool };
      }
    }

    function moveDraw(e) {
      if (!state.drawing || !state.pdf) return;
      e.preventDefault();
      const { x, y } = getPointer(e);

      if (state.tool === 'pen' || state.tool === 'eraser') {
        state.tempShape.points.push({ x, y });
        // live draw
        drawCtx.save();
        drawCtx.lineCap = 'round';
        drawCtx.lineJoin = 'round';
        drawCtx.lineWidth = state.tempShape.size;
        if (state.tool === 'eraser') {
          drawCtx.globalCompositeOperation = 'destination-out';
        } else {
          drawCtx.strokeStyle = state.color;
          drawCtx.globalCompositeOperation = 'source-over';
        }
        drawCtx.beginPath();
        drawCtx.moveTo(state.lastX, state.lastY);
        drawCtx.lineTo(x, y);
        drawCtx.stroke();
        drawCtx.restore();
        state.lastX = x;
        state.lastY = y;
      } else if (state.tool === 'line' || state.tool === 'rect' || state.tool === 'compass') {
        toolCtx.clearRect(0, 0, toolCanvas.width, toolCanvas.height);
        toolCtx.strokeStyle = state.color;
        toolCtx.lineWidth = state.brushSize;
        toolCtx.setLineDash([6, 4]);
        if (state.tool === 'line') {
          toolCtx.beginPath();
          toolCtx.moveTo(state.startX, state.startY);
          toolCtx.lineTo(x, y);
          toolCtx.stroke();
        } else if (state.tool === 'rect') {
          const w = x - state.startX;
          const h = y - state.startY;
          toolCtx.strokeRect(state.startX, state.startY, w, h);
        } else if (state.tool === 'compass' && state.compassCenter) {
          const r = Math.hypot(x - state.compassCenter.x, y - state.compassCenter.y);
          toolCtx.beginPath();
          toolCtx.arc(state.compassCenter.x, state.compassCenter.y, r, 0, Math.PI * 2);
          toolCtx.stroke();
          // center dot
          toolCtx.setLineDash([]);
          toolCtx.beginPath();
          toolCtx.arc(state.compassCenter.x, state.compassCenter.y, 3, 0, Math.PI * 2);
          toolCtx.fillStyle = state.color;
          toolCtx.fill();
        }
        toolCtx.setLineDash([]);
      }
    }

    function endDraw(e) {
      if (!state.drawing) return;
      state.drawing = false;
      toolCtx.clearRect(0, 0, toolCanvas.width, toolCanvas.height);

      if (!state.paths[state.pageNum]) state.paths[state.pageNum] = [];

      // Get end coordinates safely (pointer events give clientX/Y on the event itself)
      let endX = state.lastX, endY = state.lastY;
      try {
        const pt = getPointer(e);
        endX = pt.x; endY = pt.y;
      } catch (_) {}

      if ((state.tool === 'pen' || state.tool === 'eraser') && state.tempShape) {
        state.paths[state.pageNum].push(state.tempShape);
        state.tempShape = null;
      } else if (state.tool === 'line') {
        state.paths[state.pageNum].push({
          type: 'line',
          color: state.color,
          size: state.brushSize,
          x1: state.startX, y1: state.startY,
          x2: endX, y2: endY
        });
        redrawAnnotations();
      } else if (state.tool === 'rect') {
        state.paths[state.pageNum].push({
          type: 'rect',
          color: state.color,
          size: state.brushSize,
          x: Math.min(state.startX, endX),
          y: Math.min(state.startY, endY),
          w: Math.abs(endX - state.startX),
          h: Math.abs(endY - state.startY)
        });
        redrawAnnotations();
      } else if (state.tool === 'compass' && state.compassCenter) {
        const r = Math.hypot(endX - state.compassCenter.x, endY - state.compassCenter.y);
        if (r > 4) {
          state.paths[state.pageNum].push({
            type: 'circle',
            color: state.color,
            size: state.brushSize,
            cx: state.compassCenter.x,
            cy: state.compassCenter.y,
            r
          });
          redrawAnnotations();
        }
        state.compassCenter = null;
      }
    }

    function redrawAnnotations() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      (state.paths[state.pageNum] || []).forEach(p => drawPath(p));
    }

    // Pointer events (mouse + touch)
    drawCanvas.addEventListener('pointerdown', startDraw);
    drawCanvas.addEventListener('pointermove', moveDraw);
    drawCanvas.addEventListener('pointerup', endDraw);
    drawCanvas.addEventListener('pointerleave', endDraw);
    drawCanvas.addEventListener('pointercancel', endDraw);

    // ---------- Geometry tools (DOM overlays) ----------
    function clearGeoHints() {
      // nothing persistent
    }
    function clearAllGeo() {
      state.geoElements.forEach(el => el.remove());
      state.geoElements = [];
    }

    function spawnGeometry(type) {
      // Remove previous of same type for cleanliness (optional keep multiple)
      // We allow one of each for simplicity on smart board
      state.geoElements.filter(el => el.dataset.geo === type).forEach(el => {
        el.remove();
        state.geoElements = state.geoElements.filter(e => e !== el);
      });

      let el;
      if (type === 'ruler') {
        el = document.createElement('div');
        el.className = 'geo-overlay ruler';
        el.dataset.geo = 'ruler';
        el.style.width = '320px';
        el.innerHTML = '<div class="marks"></div><div class="label">0 — 30 cm</div>';
        el.style.left = '60px';
        el.style.top = '80px';
      } else if (type === 'protractor') {
        el = document.createElement('div');
        el.className = 'geo-overlay protractor';
        el.dataset.geo = 'protractor';
        el.style.left = '100px';
        el.style.top = '120px';
      } else if (type === 'setsquare') {
        el = document.createElement('div');
        el.className = 'geo-overlay set-square';
        el.dataset.geo = 'setsquare';
        el.style.left = '80px';
        el.style.top = '100px';
      }
      if (!el) return;

      makeDraggable(el);
      // also rotatable with two-finger or shift+drag later; for now simple drag + double-click remove
      el.addEventListener('dblclick', () => {
        el.remove();
        state.geoElements = state.geoElements.filter(e => e !== el);
      });
      canvasWrap.appendChild(el);
      state.geoElements.push(el);
      toast(type === 'ruler' ? 'Cetvel eklendi · çift tıkla kaldır' :
            type === 'protractor' ? 'Açıölçer eklendi · çift tıkla kaldır' :
            'Gönye eklendi · çift tıkla kaldır');
    }

    function makeDraggable(el) {
      let dragging = false, ox = 0, oy = 0;
      el.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        dragging = true;
        const rect = el.getBoundingClientRect();
        const parent = canvasWrap.getBoundingClientRect();
        ox = e.clientX - rect.left;
        oy = e.clientY - rect.top;
        el.setPointerCapture(e.pointerId);
      });
      el.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const parent = canvasWrap.getBoundingClientRect();
        let left = e.clientX - parent.left - ox;
        let top = e.clientY - parent.top - oy;
        el.style.left = left + 'px';
        el.style.top = top + 'px';
      });
      el.addEventListener('pointerup', () => { dragging = false; });
    }

    // Keyboard shortcuts
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') changePage(-1);
      if (e.key === 'ArrowRight') changePage(1);
      if (e.key === '+' || e.key === '=') setScale(state.scale + 0.1);
      if (e.key === '-') setScale(state.scale - 0.1);
      if (e.key === 'f' || e.key === 'F') {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
      if (e.key === 'Escape') menu.classList.remove('open');
    });

    // Initial
    toast('Z-Kitap hazır · PDF yükleyin', 3000);
  </script>
</body>
</html>
